<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Flipkart Clone</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .error-page-wrapper {
            min-height: calc(100vh - 160px);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f3f6;
            padding: 40px 15px;
        }

        .error-card {
            background: #ffffff;
            width: 580px;
            max-width: 100%;
            padding: 45px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }

        .error-code {
            font-size: 80px;
            font-weight: 800;
            color: #2874f0;
            line-height: 1;
            margin-bottom: 10px;
            letter-spacing: -2px;
        }

        .error-title {
            font-size: 22px;
            color: #212121;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .error-desc {
            color: #878787;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .btn-home {
            background: #fb641b;
            color: #ffffff;
            border: none;
            padding: 14px 32px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 2px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 6px rgba(251, 100, 27, 0.3);
            transition: background 0.2s;
        }

        .btn-home:hover {
            background: #e65100;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav id="main-nav">
        <div class="logo" onclick="window.location.href='index.html'">
            <img src="https://static-assets-web.flixcart.com/fk-p-linchpin-web/fk-cp-zion/img/flipkart-plus_8d85f4.png" alt="Flipkart" class="brand-img">
            <div class="logo-sub">
                Explore <span>Plus</span>
                <img src="https://static-assets-web.flixcart.com/fk-p-linchpin-web/fk-cp-zion/img/plus_aef861.png" alt="plus-icon" class="plus-icon">
            </div>
        </div>
    </nav>

    <!-- Error Card -->
    <main class="error-page-wrapper">
        <div class="error-card">
            <div class="error-code">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-desc">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
            <a href="index.html" class="btn-home">
                <i class="fas fa-home"></i> Back to Homepage
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-bottom">
            &copy; 2026 Flipkart-Clone. All Rights Reserved.
        </div>
    </footer>
</body>
</html>
