<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- =========================
         NAVBAR
    ========================== -->
    <nav>
        <div class="logo" onclick="window.location.href='index.html'">
            <img src="https://static-assets-web.flixcart.com/fk-p-linchpin-web/fk-cp-zion/img/flipkart-plus_8d85f4.png" alt="Flipkart" class="brand-img">
            <div class="logo-sub">
                Explore <span>Plus</span>
                <img src="https://static-assets-web.flixcart.com/fk-p-linchpin-web/fk-cp-zion/img/plus_aef861.png" alt="plus-icon" class="plus-icon">
            </div>
        </div>
        <h2>Checkout</h2>
    </nav>

    <!-- =========================
         CHECKOUT CONTAINER
    ========================== -->
    <div class="cart-container">
        <!-- LEFT: Address Form -->
        <div class="cart-left">
            <div class="checkout-step active" style="padding: 24px;">
                <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
                    <span style="background: #2874f0; color: white; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 600; border-radius: 2px;">1</span>
                    <h3 style="color: #878787; font-size: 1rem; text-transform: uppercase;">DELIVERY ADDRESS</h3>
                </div>
                <div class="step-body" style="padding-left: 40px;">
                    <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                        <input type="text" id="name" placeholder="Name" style="flex: 1; padding: 12px; border: 1px solid #e0e0e0; border-radius: 2px; outline: none;">
                        <input type="text" id="mobile" placeholder="10-digit mobile number" style="flex: 1; padding: 12px; border: 1px solid #e0e0e0; border-radius: 2px; outline: none;">
                    </div>
                    <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                        <input type="text" id="pincode" placeholder="Pincode" style="flex: 1; padding: 12px; border: 1px solid #e0e0e0; border-radius: 2px; outline: none;">
                        <input type="text" id="locality" placeholder="Locality" style="flex: 1; padding: 12px; border: 1px solid #e0e0e0; border-radius: 2px; outline: none;">
                    </div>
                    <textarea id="address" placeholder="Address (Area and Street)" style="width: 100%; height: 80px; padding: 12px; border: 1px solid #e0e0e0; border-radius: 2px; outline: none; margin-bottom: 20px; font-family: inherit;"></textarea>
                    
                    <button class="checkout-btn" onclick="placeOrder()" style="padding: 16px 40px;">DELIVER HERE</button>
                </div>
            </div>
            
            <div class="checkout-step" style="padding: 16px 24px; background: white; border-top: 1px solid #f0f0f0;">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <span style="background: #f0f0f0; color: #212121; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 600; border-radius: 2px;">2</span>
                    <h3 style="color: #878787; font-size: 1rem; text-transform: uppercase;">ORDER SUMMARY</h3>
                </div>
            </div>
            
            <div class="checkout-step" style="padding: 16px 24px; background: white; border-top: 1px solid #f0f0f0;">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <span style="background: #f0f0f0; color: #212121; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 600; border-radius: 2px;">3</span>
                    <h3 style="color: #878787; font-size: 1rem; text-transform: uppercase;">PAYMENT OPTIONS</h3>
                </div>
            </div>
        </div>

        <!-- RIGHT: Price Details -->
        <div class="cart-right">
            <div class="price-details-card">
                <h3>PRICE DETAILS</h3>
                <hr style="border: none; border-top: 1px solid #f0f0f0; margin-bottom: 20px;">
                <div class="price-row">
                    <span>Price (<span id="summary-count">0</span> items)</span>
                    <span id="summary-price">₹0</span>
                </div>
                <div class="price-row" id="checkout-discount-row" style="display: none; color: #388e3c; font-weight: 600;">
                    <span>Coupon Discount</span>
                    <span>- ₹<span id="checkout-discount-value">0</span></span>
                </div>
                <div class="price-row">
                    <span>Delivery Charges</span>
                    <span class="free-text"><del>₹40</del> Free</span>
                </div>
                <hr style="margin: 15px 0; border: none; border-top: 1px dashed #e0e0e0;">
                <div class="price-row total-row">
                    <span>Amount Payable</span>
                    <span id="checkout-total">₹0</span>
                </div>
            </div>
            <div class="safety-banner">
                <i class="fas fa-shield-alt" style="color: #878787;"></i> Safe and Secure Payments. Easy returns. 100% Authentic products.
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast"></div>

    <!-- =========================
         JAVASCRIPT
    ========================== -->
    <script src="js/script.js"></script>
    <script>
        let checkoutItems = [];
        let total = 0;
        let couponDiscount = 0;
        let isMinutesEligible = false;

        async function initCheckout() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get("id");

            let currentUser = JSON.parse(localStorage.getItem("currentUser"));
            if (currentUser) {
                // Load address book and auto-fill if possible
                let addresses = JSON.parse(localStorage.getItem("addresses_" + currentUser.mobile)) || [];
                if (addresses.length > 0) {
                    let addr = addresses[0];
                    document.getElementById("name").value = addr.name;
                    document.getElementById("mobile").value = addr.mobile;
                    document.getElementById("pincode").value = addr.pincode;
                    document.getElementById("locality").value = addr.locality;
                    document.getElementById("address").value = addr.details;
                } else {
                    document.getElementById("name").value = currentUser.name;
                    document.getElementById("mobile").value = currentUser.mobile;
                }
            }

            if (productId) {
                // BUY NOW FLOW: checkout only the single selected product
                try {
                    let response = await fetch('http://127.0.0.1:5000/products');
                    let allProducts = await response.json();
                    let targetProduct = allProducts.find(p => p.id == productId);

                    if (targetProduct) {
                        checkoutItems = [{ ...targetProduct, quantity: 1 }];
                        localStorage.setItem("checkoutItems", JSON.stringify(checkoutItems));
                        localStorage.setItem("checkoutMode", "buynow");
                        
                        // Ignore cart coupon for Buy Now
                        localStorage.removeItem("appliedCoupon");
                        
                        calculatePriceSummary();
                    } else {
                        showToast("Product not found!", "error");
                        setTimeout(() => window.location.href = "index.html", 1500);
                    }
                } catch (error) {
                    console.error("Error fetching product for Buy Now:", error);
                    showToast("Error loading product checkout details.", "error");
                }
            } else {
                // CART FLOW: checkout all items in the user's cart
                let cart = JSON.parse(localStorage.getItem("cart")) || [];
                if (cart.length === 0) {
                    showToast("Your cart is empty!", "info");
                    setTimeout(() => window.location.href = "index.html", 1000);
                    return;
                }
                
                checkoutItems = cart;
                localStorage.setItem("checkoutItems", JSON.stringify(checkoutItems));
                localStorage.setItem("checkoutMode", "cart");
                
                calculatePriceSummary();
            }
        }

        function calculatePriceSummary() {
            total = 0;
            couponDiscount = 0;
            isMinutesEligible = checkoutItems.some(p => p.isMinutesEligible);

            checkoutItems.forEach(product => {
                total += product.price * product.quantity;
            });

            document.getElementById("summary-count").innerText = checkoutItems.length;
            document.getElementById("summary-price").innerText = "₹" + total.toLocaleString();

            // Load applied coupon if checkout mode is cart
            const mode = localStorage.getItem("checkoutMode");
            if (mode === "cart") {
                let applied = JSON.parse(localStorage.getItem("appliedCoupon"));
                if (applied) {
                    couponDiscount = applied.discount;
                    document.getElementById("checkout-discount-value").innerText = couponDiscount.toLocaleString();
                    document.getElementById("checkout-discount-row").style.display = "flex";
                } else {
                    document.getElementById("checkout-discount-row").style.display = "none";
                }
            } else {
                document.getElementById("checkout-discount-row").style.display = "none";
            }

            let finalPayable = total - couponDiscount;
            document.getElementById("checkout-total").innerText = "₹" + finalPayable.toLocaleString();
        }

        function placeOrder() {
            let name = document.getElementById("name").value.trim();
            let mobile = document.getElementById("mobile").value.trim();
            let pincode = document.getElementById("pincode").value.trim();
            let locality = document.getElementById("locality").value.trim();
            let address = document.getElementById("address").value.trim();

            if (name === "" || mobile === "" || address === "" || pincode === "" || locality === "") {
                showToast("Please fill in all address parameters securely.", "error");
                return;
            }

            if (mobile.length !== 10 || isNaN(mobile)) {
                showToast("Please enter a valid 10-digit mobile number.", "error");
                return;
            }

            let finalPayable = total - couponDiscount;
            let orderDetails = { 
                name, 
                mobile, 
                address: `${address}, ${locality} - ${pincode}`, 
                total: finalPayable, 
                deliveryMethod: isMinutesEligible ? 'Minutes' : 'Standard' 
            };
            localStorage.setItem("orderDetails", JSON.stringify(orderDetails));
            window.location.href = "payment.html";
        }

        // Initialize on DOM load
        document.addEventListener("DOMContentLoaded", initCheckout);
    </script>
</body>
</html>
