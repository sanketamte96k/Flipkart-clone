<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order | Flipkart Clone</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="orders-body-bg">
    <!-- =========================
         Navbar
    ========================== -->
    <nav id="main-nav">
        <div class="logo" onclick="window.location.href='index.html'">
            <img src="https://static-assets-web.flixcart.com/fk-p-linchpin-web/fk-cp-zion/img/flipkart-plus_8d85f4.png" alt="Flipkart" class="brand-img">
            <div class="logo-sub">
                Explore <span>Plus</span>
                <img src="https://static-assets-web.flixcart.com/fk-p-linchpin-web/fk-cp-zion/img/plus_aef861.png" alt="plus-icon" class="plus-icon">
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="search" placeholder="Search for products, brands and more" autocomplete="off">
            <i class="fas fa-search search-icon"></i>
            <div id="suggestions"></div>
        </div>

        <div class="nav-right">
            <div id="user-area">
                <button onclick="window.location.href='index.html'" class="login-btn">Login</button>
            </div>
            <button onclick="window.location.href='orders.html'" class="nav-btn">
                <i class="fas fa-box"></i> Orders
            </button>
            <button id="cart-count" class="nav-btn nav-cart" onclick="window.location.href='cart.html'">
                <i class="fas fa-shopping-cart cart-icon"></i> Cart
            </button>
        </div>
    </nav>

    <!-- =========================
         TRACKING CONTENT
    ========================== -->
    <div class="product-page-container" style="max-width: 1100px; gap: 20px; background: transparent; box-shadow: none; padding: 0; margin-top: 30px;">
        <!-- Left Column -->
        <div class="cart-left" style="flex: 2; display: flex; flex-direction: column; gap: 20px;">
            <!-- Delivery Address -->
            <div class="checkout-step" style="padding: 24px; background: white; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1);">
                <h3 style="font-size: 1rem; color: #878787; margin-bottom: 15px; text-transform: uppercase;">Delivery Address</h3>
                <h4 id="track-name" style="font-size: 1rem; color: #212121; margin-bottom: 10px;"></h4>
                <p id="track-address" style="font-size: 0.9rem; color: #212121; margin-bottom: 10px; line-height: 1.5;"></p>
                <p style="font-size: 0.9rem; color: #212121;"><b>Phone number:</b> <span id="track-mobile"></span></p>
            </div>

            <!-- Timeline -->
            <div class="checkout-step" style="padding: 30px 40px; background: white; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1);">
                <h3 style="font-size: 1rem; color: #878787; margin-bottom: 30px; text-transform: uppercase;">Order Tracking</h3>
                <div class="tracking-container">
                    <div class="track-step active" id="step-ordered">
                        <div class="track-icon"><i class="fas fa-check"></i></div>
                        <div class="track-content">
                            <h4>Order Confirmed</h4>
                            <p id="time-ordered"></p>
                        </div>
                    </div>
                    
                    <div class="track-step" id="step-shipped">
                        <div class="track-icon"><i class="fas fa-check"></i></div>
                        <div class="track-content">
                            <h4>Shipped</h4>
                            <p id="time-shipped">Expected soon</p>
                        </div>
                    </div>
                    
                    <div class="track-step" id="step-out">
                        <div class="track-icon"><i class="fas fa-check"></i></div>
                        <div class="track-content">
                            <h4>Out for Delivery</h4>
                            <p id="time-out">Pending</p>
                        </div>
                    </div>
                    
                    <div class="track-step" id="step-delivered">
                        <div class="track-icon"><i class="fas fa-check"></i></div>
                        <div class="track-content">
                            <h4>Delivered</h4>
                            <p id="time-delivered">Pending</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column -->
        <div class="cart-right" style="flex: 1.2;">
            <div class="price-details-card" style="margin-bottom: 20px;">
                <h3 style="font-size: 1rem; color: #878787; margin-bottom: 20px;">ORDER ITEM</h3>
                <div id="track-product-details" style="display: flex; gap: 15px; margin-bottom: 20px; align-items: flex-start;">
                    <!-- Injected via JS -->
                </div>
                <hr style="border: none; border-top: 1px solid #f0f0f0; margin-bottom: 15px;">
                <div class="price-row total-row">
                    <span>Total Amount</span>
                    <span id="track-total">₹0</span>
                </div>
            </div>
            
            <div class="safety-banner" style="background: white; padding: 15px; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1);">
                <i class="fas fa-shield-alt" style="color: #878787;"></i> Safe and Secure Payments. Easy returns.
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <!-- Script to Handle Tracking Logic -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        // Using hash or parameter to get index
        const orderIndex = window.location.search.split('id=')[1];
        
        let orders = JSON.parse(localStorage.getItem("orders")) || [];
        // Orders in the frontend are rendered reverse, so we need to match the index if it's based on the original array or the reversed array.
        // It's safer to reverse it if we passed the index from the reversed array.
        let order = orders.slice().reverse()[orderIndex];

        if(!order) {
            document.body.innerHTML = "<h2 style='text-align:center; margin-top:50px;'>Order not found!</h2>";
        } else {
            // Populate Details
            document.getElementById("track-name").innerText = order.name;
            document.getElementById("track-address").innerText = order.address;
            document.getElementById("track-mobile").innerText = order.mobile;
            document.getElementById("track-total").innerText = "₹" + order.total.toLocaleString();

            const p = order.products[0];
            document.getElementById("track-product-details").innerHTML = `
                <img src="${p.image}" style="width: 70px; height: 70px; object-fit: contain;">
                <div>
                    <h4 style="font-size: 1rem; color: #212121; font-weight: 500; margin-bottom: 5px;">${p.name}</h4>
                    <p style="font-size: 0.85rem; color: #878787;">Seller: RetailNet</p>
                    <p style="font-size: 1.1rem; color: #212121; font-weight: 600; margin-top: 8px;">₹${p.price.toLocaleString()}</p>
                </div>
            `;

            // Calculate Timeline
            let orderTime = new Date(order.date).getTime();
            let now = new Date().getTime();
            let diffMins = (now - orderTime) / (1000 * 60);

            document.getElementById("time-ordered").innerText = new Date(orderTime).toLocaleString();

            // Flipkart tracking demo simulation based on time elapsed
            if (diffMins >= 1) {
                // Shipped after 1 minute
                document.getElementById("step-ordered").classList.add("line-active");
                document.getElementById("step-shipped").classList.add("active");
                document.getElementById("time-shipped").innerText = new Date(orderTime + 60000).toLocaleString();
            }
            if (diffMins >= 3) {
                // Out for delivery after 3 mins
                document.getElementById("step-shipped").classList.add("line-active");
                document.getElementById("step-out").classList.add("active");
                document.getElementById("time-out").innerText = new Date(orderTime + 180000).toLocaleString();
            }
            if (diffMins >= 5) {
                // Delivered after 5 mins
                document.getElementById("step-out").classList.add("line-active");
                document.getElementById("step-delivered").classList.add("active");
                document.getElementById("time-delivered").innerText = new Date(orderTime + 300000).toLocaleString();
            }
        }
    </script>
</body>
</html>
